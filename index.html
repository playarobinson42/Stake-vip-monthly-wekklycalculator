<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VIP Bonus Calculator</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:30px;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:14px;
    margin-top:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:15px;
    font-size:18px;
}

.banner{
    margin-top:50px;
}

.banner a{
    display:block;
    background:#ef4444;
    color:white;
    padding:25px;
    border-radius:14px;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>VIP Bonus Calculator</h1>

<div class="card">

<h3>VIP Tier</h3>

<select id="vip">
<option value="0.0007">Bronze</option>
<option value="0.0010">Silver</option>
<option value="0.0013">Gold</option>
<option value="0.0018">Platinum</option>
<option value="0.0025">Diamond</option>
</select>

<input id="wager" type="number" placeholder="Enter Wager Amount">
<input id="net" type="number" placeholder="Enter Net Profit/Loss (negative if loss)" value="0">

<button onclick="calculate()">Estimate Bonus</button>

<div id="result" class="result"></div>

</div>

<!-- Affiliate Banner -->
<div class="banner">
<a href="https://stake.com/?c=oaMn3XsJ" target="_blank">
🎰 Start Your VIP Grind Now<br>
<span style="font-size:16px;font-weight:normal;">
Join Stake & Track Your Bonus Potential
</span>
</a>
</div>

</div>

<script>
function calculate(){

let multiplier = parseFloat(document.getElementById("vip").value);
let wager = parseFloat(document.getElementById("wager").value);
let net = parseFloat(document.getElementById("net").value);

if(!wager){
document.getElementById("result").innerHTML="Enter wager amount";
return;
}

let bonus = wager * multiplier;

if(net < 0){
bonus += Math.abs(net) * 0.0015;
}
else if(net > 0){
bonus *= 0.5;
}

document.getElementById("result").innerHTML=
"Estimated Bonus: $" + bonus.toFixed(2);
}
</script>

</body>
</html>
